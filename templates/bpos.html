<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:,">
  <title>Blood Pressure</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
    integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <main class="container">

    <div id="header">
      <h1>Blood Pressure</h1>
      <a class="secondary" role="button" href="/?page-size=2147483647" aria-label="Load all">
        <i class="ti ti-table-plus"></i>
        <span class="hide-on-mobile">LOAD ALL</span>
      </a>
      <button class="secondary" command="show-modal" commandfor="import-dialog" aria-label="Import">
        <i class="ti ti-upload"></i>
        <span class="hide-on-mobile">IMPORT</span>
      </button>      
      <a class="secondary" role="button" href="/export/" aria-label="Export">
        <i class="ti ti-download"></i>
        <span class="hide-on-mobile">EXPORT</span>
      </a>
    </div>

    <div class="overflow-auto">
      <table>
        <thead>
          <tr>
            <th aria-label="Blood Pressure Classification"></th>
            <th>Date</th>
            <th>Time</th>
            <th class="hide-on-mobile" aria-label="irregular heartbeat"><i class="ti ti-heart-bolt"></i></th>
            <th>
              <span class="hide-on-desktop">Sys</span>
              <span class="hide-on-mobile">Systolic</span>
            </th>
            <th>
              <span class="hide-on-desktop">Dia</span>
              <span class="hide-on-mobile">Diastolic</span>
            </th>
            <th class="hide-on-mobile">Pulse</th>
            <th class="hide-on-mobile">Comment</th>
            <th>
            </th>
          </tr>
        </thead>
        <tbody>
          {{range .RowViews}}
          {{template "bpo-row" .}}
          {{end}}
        </tbody>
      </table>
    </div>

    
    <button
       class="w-100"
       hx-get="/new/"
       hx-target="#bpo-CRUD-dialog"
       hx-swap="innerHTML"
       hx-on::after-request="document.querySelector('#bpo-CRUD-dialog').showModal(); setDefaultDateTime();"><i class="ti ti-plus"></i><span>ADD NEW</span></button>
    
    <dialog id="bpo-CRUD-dialog" closedby="any">
      <!-- dynamically filled via HTMX -->
    </dialog>
    <dialog id="import-dialog" closedby="any">
      <article>
        <form method="post" action="/import/">
          <label for="import-csv">
            <b>Observations to Import</b>
          </label>
          <textarea id="import-csv" name="import-csv" rows="10" cols="30" placeholder="ObservedAt;Irregular Heartbeat;Systolic;Diastolic;Pulse;Comment
2026-07-09T22:41;false;9;8;7;Test1;
2026-07-09T11:18;false;1;2;1;Test2;"></textarea>
          <button type="submit">
            <i class="ti ti-check"></i>
            <span>CREATE</span>
          </button>
        </form>
      </article>
    </dialog>

  </main>
</body>

</html>
