<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:,">
  <title>Blood Pressure</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
    integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="static/app.css">
  <script src="static/app.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <main class="container">

    <div>
      <h1>Blood Pressure</h1>

      <div class="float-right">
        {{if .Editable}}
        <a class="secondary" aria-label="action" href="/" role="button">CANCEL</a>
        {{else}}
        <a class="secondary" aria-label="action" href="/?editable=true" role="button">EDIT</a>
        {{end}}
        <button class="secondary" command="show-modal" commandfor="import-dialog">IMPORT</button>
        <a class="secondary" role="button" href="/export">EXPORT</a>
      </div>
    </div>

    {{range .Bpos}}
    <form id="bpo-{{.ID}}" action="/{{.ID}}/update" method="post"></form>
    {{end}}
    <colgroup>
      <col class="id-col">
      <col class="date-col">
      <col class="time-col">
      <col class="irregular-col">
      <col class="systolic-col">
      <col class="diastolic-col">
      <col class="pulse-col">
      <col class="comment-col">
      <col class="action-col">
    </colgroup>
    <table>
      <thead>
        <tr>
          <th hidden>ID</th>
          <th>Date</th>
          <th>Time</th>
          <th aria-label="irregular heartbeat"><i class="ti ti-heart-bolt"></i></th>
          <th>Systolic</th>
          <th>Diastolic</th>
          <th>Pulse</th>
          <th>Comment</th>
          <th>
          </th>
        </tr>
      </thead>
      <tbody>
        {{range .Bpos}}
        {{if $.Editable}}
        {{template "bpo-row-editable" .}}
        {{else}}
        {{template "bpo-row" .}}
        {{end}}
        {{end}}
      </tbody>
    </table>

    <button class="w-100" command="show-modal" commandfor="add-new-bpo-dialog" onclick="setDefaultDateTime()">ADD
      NEW</button>
    <dialog id="add-new-bpo-dialog" closedby="any">
      <article>
        <form id="bpo-new" action="/" method="dialog">
          <fieldset class="grid">
            <div>
              <label for="date">Date</label>
              <input id="bpo-new-date" name="date" type="date" />
            </div>
            <div>
              <label for="time">Time</label>
              <input id="bpo-new-time" name="time" type="time" step="60" />
            </div>
          </fieldset>
          <fieldset class="grid">
            <div>
              <label for="systolic">Systolic</label>
              <input name="systolic" type="number" />
            </div>
            <div>
              <label for="diastolic">Diastolic</label>
              <input name="diastolic" type="number" />
            </div>
            <div>
              <label for="pulse">Pulse</label>
              <input name="pulse" type="number" />
            </div>
          </fieldset>
          <fieldset>
            <input name="irregular" type="checkbox" />
            <i class="ti ti-heart-bolt"></i>
            <label for="irregular">Irregular heartbeat</label>
          </fieldset>
          <label for="comment">Comment</label>
          <textarea name="comment" type="text"></textarea>
          <button type="submit" hx-post="/" hx-target="tbody" hx-swap="afterbegin"
            hx-on:htmx:after-request="if(event.detail.successful) resetFormModal(this)">CREATE</button>
        </form>
      </article>
    </dialog>

    <dialog id="import-dialog" closedby="any">
      <article>
        <form method="post" action="/import">
          <label for="import-csv">
            <b>Observations to Import</b>
            <p>Without header row</p>
          </label>
          <textarea type="file" name="import-csv" rows="10" cols="30" placeholder="2026-07-09T22:41;false;9;8;7;Test1;
2026-07-09T11:18;false;1;2;1;Test2;"></textarea>
          <button type="submit">CREATE</button>
      </article>
    </dialog>

  </main>
</body>

</html>
