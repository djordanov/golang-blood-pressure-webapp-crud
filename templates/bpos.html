<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:,">
  <title>Blood Pressure</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
    integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <main class="container-fluid">

    <div>
      <h1>Blood Pressure</h1>

      <div class="float-right">
        <button class="secondary" command="show-modal" commandfor="import-dialog">
          <i class="ti ti-upload"></i>
          <span class="hide-on-mobile">IMPORT</span>
        </button>
        <a class="secondary" role="button" href="/export/">
          <i class="ti ti-download"></i>
          <span class="hide-on-mobile">EXPORT</span>
        </a>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th class="hide-on-mobile" aria-label="irregular heartbeat"><i class="ti ti-heart-bolt"></i></th>
          <th>Systolic</th>
          <th>Diastolic</th>
          <th class="hide-on-mobile">Pulse</th>
          <th class="hide-on-mobile">Comment</th>
          <th>
          </th>
        </tr>
      </thead>
      <tbody>
        {{range .Bpos}}
        {{template "bpo-row" .}}
        {{end}}
      </tbody>
    </table>
    <button
       class="w-100"
       hx-get="/new/"
       hx-target="#bpo-CRUD-dialog"
       hx-swap="innerHTML"
       hx-on::after-request="document.querySelector('#bpo-CRUD-dialog').showModal(); setDefaultDateTime();"><i class="ti ti-plus"></i> ADD NEW</button>
    <form method="get" action="/">
      <fieldset class="grid">
        <div>
          <label for="page-size">Page Size</label>
          <input id="page-size" name="page-size" required type="number" step="1" value="{{.PageSize}}" />
        </div>
        <div>
          <label for="page-number">Page Number</label>
          <input id="page-number" name="page-number" required type="number" step="1" value="{{.PageNumber}}" />
        </div>
        <div>
          <label>Placeholder</label>
          <button type="submit">OK</button>
        </div>
      </fieldset>
    </form>

    <dialog id="bpo-CRUD-dialog" closedby="any">
      <!-- dynamically filled via HTMX -->
    </dialog>
    <dialog id="import-dialog" closedby="any">
      <article>
        <form method="post" action="/import/">
          <label for="import-csv">
            <b>Observations to Import</b>
          </label>
          <textarea id="import-csv" name="import-csv" rows="10" cols="30" placeholder="ObservedAt;Irregular Heartbeat;Systolic;Diastolic;Pulse;Comment
2026-07-09T22:41;false;9;8;7;Test1;
2026-07-09T11:18;false;1;2;1;Test2;"></textarea>
          <button type="submit">
            <i class="ti ti-check"></i>
            <span>CREATE</span>
          </button>
        </form>
      </article>
    </dialog>

  </main>
</body>

</html>
