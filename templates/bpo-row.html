{{define "bpo-row"}}
<tr>
  <td hidden></td>
  <td>{{.ObservedAt.Format `Mon. 02 January 2006`}}</td>
  <td>{{.ObservedAt.Format `15:04`}}</td>
  <td>{{if .Irregular}}<i class="ti ti-bolt"></i>{{end}}</td>
  <td>{{.Systolic}}</td>
  <td>{{.Diastolic}}</td>
  <td>{{.Pulse}}</td>
  <td>{{.Comment}}</td>
  <td></td>
</tr>
{{end}}
