{{define "bpo-row"}}
<tr id="bpo-row-{{.Bpo.ID}}">
  <td aria-label="Classification" class="hide-on-mobile {{.ClassifyBpo}}">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="10" />
    </svg>
  </td>
  <td><time datetime="{{.Bpo.ObservedAt.Format `2006-01-02`}}">
    <span class="hide-on-desktop">{{.Bpo.ObservedAt.Format `02.01`}}</span>
    <span class="hide-on-mobile">{{.Bpo.ObservedAt.Format `Mon. 02 January 2006`}}</span>
  </time></td>
  <td>{{.Bpo.ObservedAt.Format `15:04`}}</td>
  <td class="hide-on-mobile">{{if .Bpo.Irregular}}<i class="ti ti-bolt"></i>{{end}}</td>
  <td>{{.Bpo.Systolic}}</td>
  <td>{{.Bpo.Diastolic}}</td>
  <td class="hide-on-mobile">{{.Bpo.Pulse}}</td>
  <td class="hide-on-mobile">{{.Bpo.Comment}}</td>
  <td>
    <button
       aria-label="Edit"
       class="secondary w-100"
       hx-get="/edit/{{.Bpo.ID}}/"
       hx-target="#bpo-CRUD-dialog"
       hx-swap="innerHTML"
       hx-on::after-request="document.querySelector('#bpo-CRUD-dialog').showModal();">
      <i class="ti ti-edit"></i>
      <span class="hide-on-mobile">EDIT</span>
    </button>
  </td>
</tr>
{{end}}
