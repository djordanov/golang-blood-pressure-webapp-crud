version: "2"
overrides:
  go:
    overrides:
      - db_type: "boolean"
        go_type: "bool"
      - db_type: "INTEGER"
        go_type: "int"
sql:
  - engine: "postgresql"
    queries: "query.sql"
    schema: "schema.sql"
    database:
      uri: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}?sslmode=disable"
    gen:
      go:
        package: "bpo"
        out: "bpo"